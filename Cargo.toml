[workspace]
members = [
    ".",
    "crates/aster_drive_writer",
    "crates/aster_drive_migration_core",
    "crates/cloudreve_adapter",
    "crates/cloudreve_schema",
]

[workspace.package]
authors = [
    "AptS-1547 <apts-1547@esaps.net>",
    "AptS-1738 <apts-1738@esaps.net>",
    "Cg8 <5712.cg8@gmail.com>"
]
repository = "https://github.com/AptS-1547/AsterDriveMigration"
license = "MIT"
edition = "2024"
rust-version = "1.94.0"

[workspace.dependencies]
aster_drive_model = { git = "https://github.com/AsterCommunity/AsterDrive", package = "aster_drive_model" }
aster_drive_schema_migration = { git = "https://github.com/AsterCommunity/AsterDrive", package = "aster_drive_migration" }
aster_drive_writer = { path = "crates/aster_drive_writer" }
aster_drive_migration_core = { path = "crates/aster_drive_migration_core" }
argon2 = "0.5.3"
aws-sdk-s3 = "1.137.0"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false }
clap = "4"
cloudreve_adapter = { path = "crates/cloudreve_adapter" }
cloudreve_schema = { path = "crates/cloudreve_schema" }
color-eyre = "0.6.5"
hmac = "0.12"
mime_guess = "2"
sea-orm = { version = "2.0.0", default-features = false }
serde = "1.0.229"
serde_json = "1"
sha2 = "0.10"
tokio = "1"
urlencoding = "2"
uuid = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Suppressions must remain observable: `expect` reports when its justification goes stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

[package]
name = "aster_drive_migration"
version = "0.0.0-alpha.0"
description = "Migration tool for AsterDrive, from other self-hosted drive solutions to AsterDrive."
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

# 开发构建优先缩短「改代码 -> 编译/测试」的反馈时间。
# 工作区代码保持 O0 以避免每次修改后重做优化；第三方依赖单独使用 O1，
# 避免 crypto/image/compression 等依赖在 debug/test 运行时过慢。
[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
debug = 1
panic = "unwind"
strip = false
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
strip = true
panic = "abort"

[lints]
workspace = true

[dependencies]
aster_drive_model.workspace = true
aster_drive_writer.workspace = true
aster_drive_migration_core.workspace = true
# Alias the upstream schema-migration crate so it does not collide with this
# package's own `aster_drive_migration` library name.
aster_drive_schema_migration.workspace = true
argon2.workspace = true
aws-sdk-s3.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }
clap = { workspace = true, features = ["derive", "env"] }
cloudreve_adapter.workspace = true
cloudreve_schema.workspace = true
color-eyre.workspace = true
sea-orm = { workspace = true, features = ["sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "macros", "runtime-tokio-rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
uuid = { workspace = true, features = ["v4"] }

[lib]
doctest = false
