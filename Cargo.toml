[package]
name = "aster_drive_migration"
version = "0.0.0-alpha.0"
description = "Migration tool for AsterDrive, from other self-hosted drive solutions to AsterDrive."
authors = [
    "AptS-1547 <apts-1547@esaps.net>",
]
repository = "https://github.com/AptS-1547/AsterDriveMigration"
license = "MIT"
edition = "2024"
rust-version = "1.94.0"

# 优化配置
[profile.dev]
opt-level = 1
lto = false
codegen-units = 16
panic = "unwind"
strip = false
incremental = true

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = [
    ".",
    "crates/cloudreve_schema",
]

[dependencies]
aster_drive_model = { git = "https://github.com/AsterCommunity/AsterDrive", package = "aster_drive_model" }
# Alias the upstream schema-migration crate so it does not collide with this
# package's own `aster_drive_migration` library name.
aster_drive_schema_migration = { git = "https://github.com/AsterCommunity/AsterDrive", package = "aster_drive_migration" }
argon2 = "0.5.3"
aws-sdk-s3 = "1.137.0"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
cloudreve_schema = { path = "crates/cloudreve_schema" }
color-eyre = "0.6.5"
hmac = "0.12"
mime_guess = "2"
sea-orm = { version = "2.0.0", features = ["sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "macros", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[lib]
doctest = false
